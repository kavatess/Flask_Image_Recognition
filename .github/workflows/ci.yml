name: CI

on:
  push:
    branches: [main, ci-setup]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pylint
        run: pylint app.py model.py conftest.py test_*.py

      - name: Run pytest
        run: pytest -v
